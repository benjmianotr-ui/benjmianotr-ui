nome:  segredos.GITHUB_TOKEN 

em:
  # executado automaticamente a cada 24 horas
  agendar:
    - cron: "0 */24 * **" 
  
  # permitir executar manualmente ou trabalhar a qualquer momento
  fluxo de trabalho_despacho:
  
  # execute em cada push sem branch master
  empurrar:
    ramos:
    - mestre
    
  

empregadores:
  gerar:
    permissões: 
      conteúdo: escrivão
    continua correndo: ubuntu-mais recente
    tempo limite-minutos: 5
    
    etapas:
      # gera um jogo de cobra a partir de um gráfico de contribuições do usuário do github (<github_user_name>), gera uma animação svg em <svg_out_path>
      - nome: gerar github-contribution-grid-snake.svg
        usos: Platane/snk/svg-only@v3
        com:
          nome_usuário_github: ${{ github.proprietário_repositório }}
          saídas: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?paleta=github-escuro
          
          
      # envie o conteúdo de <build_dir> para uma ramificação
      # o conteúdo está disponível em https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file> , ou como página do github
      - nome: envie github-contribution-grid-snake.svg para o branch de saúde
        usos: luco-máx/ghaction-github-pages@v3.1.0
        com:
          ramificação_alvo: saída
          construir_diretório: dist
        ambiente:
          GITHUB_TOKEN: ${{ segredos.GITHUB_TOKEN }}
